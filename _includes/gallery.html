<!-- <a href = '{{ include.href | relative.url }}'> {{ include.name }} </a> -->

<div class = 'post-list'>
    {% for post in include.collection %}
        <a href = '{{ post.href }}' >
            <small> [{{ post.type }}] </small>
            {{ post.title }}
            <span class = date> {{ post.date | date: '%-d %b, %Y' }} </span>
        </a>
    {% endfor %}
</div>
